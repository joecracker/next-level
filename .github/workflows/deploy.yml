# Auto-deploys this app to Cloudflare Workers on every push to main.
name: Deploy to Cloudflare Workers
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
        env:
          VITE_GOOGLE_CLIENT_ID: 697837929024-544irmi27plds8pmjua5pfk17qilm7j2.apps.googleusercontent.com
      # SPA fallback is handled by the Worker config; the Pages-style catch-all rule can loop on Workers
      - run: rm -f dist/_redirects
      - run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
